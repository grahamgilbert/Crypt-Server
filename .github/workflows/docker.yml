name: Build and push image

on:
  push:
    branches: [master]
    tags: ["*"]

env:
  TAG: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags build as the tag name; master builds move `latest`.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: macadmins/crypt-server:${{ env.TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # crypt-server-saml builds FROM this image, so it has to run after the push.
      # Needs a PAT: GITHUB_TOKEN cannot dispatch to another repo.
      - name: Trigger crypt-server-saml build
        env:
          GH_TOKEN: ${{ secrets.SAML_DISPATCH_TOKEN }}
        run: |
          jq -n --arg tag "$TAG" \
            '{event_type: "build", client_payload: {tag: $tag}}' \
            | gh api repos/grahamgilbert/crypt-server-saml/dispatches --input -
